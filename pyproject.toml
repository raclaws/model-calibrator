[project]
name = "model-calibrator"
version = "0.2.0"
description = "Runtime capability calibration for LLMs in agentic coding harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ahasveros" }]
keywords = ["llm", "calibration", "agentic", "coding", "harness"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_calibrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
